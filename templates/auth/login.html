<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — DokterKlik</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-blue-700">DokterKlik</h1>
      <p class="text-gray-500 text-sm mt-1">Platform Manajemen Klinik</p>
    </div>

    <div class="bg-white rounded-2xl shadow-md p-8">
      <h2 class="text-lg font-semibold text-gray-800 mb-6">Masuk ke Akun Anda</h2>

      {% if error %}
        <div class="bg-red-50 text-red-700 text-sm px-4 py-3 rounded-lg mb-4 border border-red-200">
          {{ error }}
        </div>
      {% endif %}

      <form method="post" action="{{ url('auth-login-web') }}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email"
                 id="email"
                 name="email"
                 required
                 autofocus
                 value="{{ email or '' }}"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                        focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </div>

        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password"
                 id="password"
                 name="password"
                 required
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                        focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium
                       hover:bg-blue-700 transition focus:outline-none focus:ring-2 focus:ring-blue-500">
          Masuk
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      &copy; {{ now.year if now else '2026' }} DokterKlik. Hak cipta dilindungi.
    </p>
  </div>
</body>
</html>
