<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
  <div class="bg-white rounded-xl shadow p-4">
    <p class="text-xs text-gray-500 mb-1">Antrean Hari Ini</p>
    <p class="text-3xl font-bold text-blue-600">{{ stats.queue_total }}</p>
  </div>
  <div class="bg-white rounded-xl shadow p-4">
    <p class="text-xs text-gray-500 mb-1">Sudah Dilayani</p>
    <p class="text-3xl font-bold text-green-600">{{ stats.queue_served }}</p>
  </div>
  <div class="bg-white rounded-xl shadow p-4">
    <p class="text-xs text-gray-500 mb-1">Menunggu</p>
    <p class="text-3xl font-bold text-yellow-600">{{ stats.queue_waiting }}</p>
  </div>
  <div class="bg-white rounded-xl shadow p-4">
    <p class="text-xs text-gray-500 mb-1">Pendapatan Hari Ini</p>
    <p class="text-2xl font-bold text-gray-800">Rp {{ "{:,.0f}".format(stats.revenue_today) }}</p>
  </div>
</div>
<div class="mt-3 text-right">
  <span class="text-xs text-gray-400">Total pasien terdaftar: {{ stats.total_patients }}</span>
</div>
