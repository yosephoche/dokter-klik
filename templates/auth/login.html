<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — DokterKlik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .input-field {
      width: 100%;
      border: 1.5px solid #e2e8f0;
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #f8fafc;
    }
    .input-field:focus {
      outline: none;
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
      background: white;
    }
    .btn-login {
      width: 100%;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 9px;
      padding: 11px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-login:hover { background: #0f766e; }
    .bg-mesh {
      background: linear-gradient(135deg, #0f172a 0%, #0d3d38 50%, #0f172a 100%);
    }
  </style>
</head>
<body class="min-h-screen flex bg-mesh items-center justify-center px-4 py-8">

  <div class="w-full max-w-sm">

    <!-- Logo area -->
    <div class="text-center mb-8">
      <div style="display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; background:#0d9488; border-radius:14px; margin-bottom:16px;">
        <svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
      </div>
      <h1 style="font-size:24px; font-weight:800; color:white; letter-spacing:-0.03em;">DokterKlik</h1>
      <p style="color:#64748b; font-size:13px; margin-top:4px;">Platform Manajemen Klinik</p>
    </div>

    <!-- Login card -->
    <div style="background:white; border-radius:16px; padding:32px; box-shadow:0 20px 60px rgba(0,0,0,0.3);">
      <h2 style="font-size:17px; font-weight:700; color:#0f172a; margin-bottom:6px;">Masuk ke Akun</h2>
      <p style="font-size:13px; color:#94a3b8; margin-bottom:24px;">Gunakan email dan kata sandi Anda</p>

      {% if error %}
        <div style="background:#fef2f2; border:1px solid #fecaca; color:#991b1b; font-size:13px; padding:10px 14px; border-radius:8px; margin-bottom:18px;">
          {{ error }}
        </div>
      {% endif %}

      <form method="post" action="{{ url('auth-login-web') }}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ get_csrf_token(request) }}">

        <div style="margin-bottom:16px;">
          <label style="display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:6px;">Email</label>
          <input type="email"
                 name="email"
                 required
                 autofocus
                 value="{{ email or '' }}"
                 class="input-field"
                 placeholder="dokter@klinik.com">
        </div>

        <div style="margin-bottom:24px;">
          <label style="display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:6px;">Password</label>
          <input type="password"
                 name="password"
                 required
                 class="input-field"
                 placeholder="••••••••">
        </div>

        <button type="submit" class="btn-login">Masuk</button>
      </form>
    </div>

    <p style="text-align:center; font-size:12px; color:#475569; margin-top:20px;">
      &copy; {{ now.year if now else '2026' }} DokterKlik. Hak cipta dilindungi.
    </p>
  </div>
</body>
</html>
